name: Pruebas de la plataforma

on:
  pull_request:
    paths: ['plataforma/**', '.github/workflows/pruebas.yml']
  push:
    branches: [main]
    paths: ['plataforma/**', '.github/workflows/pruebas.yml']

permissions:
  contents: read

jobs:
  estilo:
    name: Estilo del código (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Revisar estilo
        run: vendor/bin/pint --test

  pruebas:
    name: PHPUnit (SQLite y MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: marketcity_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, pdo_mysql, sodium, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/package-lock.json
      - name: Dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pruebas
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'marketcity_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
