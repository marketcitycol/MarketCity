# Site behind basic auth; never indexable.
server {
  listen 80;
  client_max_body_size 256m;
  auth_basic "MarketCity clone (no productivo)";
  auth_basic_user_file /etc/nginx/htpasswd;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  location = /robots.txt { auth_basic off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
  location / {
    proxy_pass http://wordpress:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# Captured e-mails (Mailpit UI)
server {
  listen 8025;
  auth_basic "MarketCity clone mail";
  auth_basic_user_file /etc/nginx/htpasswd;
  location / {
    proxy_pass http://mailpit:8025;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
}
